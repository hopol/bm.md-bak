name: 发布 npm 包

on:
  push:
    branches:
      - master

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 构建并发布 CLI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 测试 CLI
        run: pnpm test src/cli/index.test.ts

      - name: 构建 CLI
        run: pnpm build:cli

      - name: 发布新版本
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'

          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'))
          const registry = 'https://registry.npmjs.org'
          const response = await fetch(`${registry}/${encodeURIComponent(name)}/${version}`)
          if (response.status === 404) {
            execFileSync('npm', ['publish', '--ignore-scripts', '--access', 'public', '--registry', registry], { stdio: 'inherit' })
          } else if (response.ok) {
            console.log(`${name}@${version} 已发布，跳过上传`)
          } else {
            throw new Error(`无法核对 npm 版本：HTTP ${response.status}`)
          }
          NODE
